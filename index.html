<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análise Proteômica 3D</title>
  
  <!-- Biblioteca 3Dmol.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
    }

    /* Menu de Abas no topo */
    .tab-buttons {
      display: flex;
      justify-content: center;
      background-color: #ffffff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      background: none;
      cursor: pointer;
      color: #666;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: #238b8b;
      border-bottom: 3px solid #238b8b;
    }

    .content-section {
      display: none;
      padding: 15px;
      max-width: 800px;
      margin: auto;
    }

    .content-section.active {
      display: block;
    }

    /* Visualizador 3D da Proteína */
    #mol-viewer {
      width: 100%;
      height: 55vh;
      border: 1px solid #ddd;
      border-radius: 10px;
      background-color: #fff;
    }

    /* Barra de Confiabilidade */
    .confidence-bar {
      display: flex;
      height: 12px;
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      margin: 15px 0 8px 0;
    }

    .segment.high { background-color: #238b8b; }
    .segment.moderate { background-color: #808080; }
    .segment.low { background-color: #7030a0; }

    .confidence-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .label.high { color: #238b8b; }
    .label.moderate { color: #808080; }
    .label.low { color: #7030a0; }

    /* Janela para o Gráfico 3D embutido (iframe) */
    .iframe-grafico {
      width: 100%;
      height: 60vh;
      border: 1px solid #ddd;
      border-radius: 10px;
      background-color: #fff;
    }
  </style>
</head>
<body>

  <!-- Menu de Seleção -->
  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('tab-3d')">Proteína 3D</button>
    <button class="tab-btn" onclick="switchTab('tab-graficos')">Gráfico 3D Interativo</button>
  </div>

  <!-- ABA 1: Proteína 3D -->
  <div id="tab-3d" class="content-section active">
    <h3>Vitellogenina (AlphaFold 2)</h3>
    <p style="font-size: 13px; color: #666;">Interaja: rote com 1 dedo e faça zoom com 2 dedos.</p>
    <div id="mol-viewer"></div>
  </div>

  <!-- ABA 2: Gráfico 3D Interativo e Barra de Métrica -->
  <div id="tab-graficos" class="content-section">
    <h3>Confiabilidade dos Modelos</h3>
    
    <!-- Barra Segmentada -->
    <div class="confidence-bar">
      <div class="segment high" style="width: 39.6%;"></div>
      <div class="segment moderate" style="width: 31.4%;"></div>
      <div class="segment low" style="width: 28.9%;"></div>
    </div>
    <div class="confidence-labels">
      <span class="label high">High 2.075 (39.6%)</span>
      <span class="label moderate">Moderate 1.644 (31.4%)</span>
      <span class="label low">Low 1.515 (28.9%)</span>
    </div>

    <!-- Gráfico 3D carregado via HTML -->
    <h3>Distribuição de Métricas (3D)</h3>
    <p style="font-size: 13px; color: #666;">Gire e navegue pelos pontos do gráfico abaixo:</p>
    
    <!-- Mude "grafico_3d.html" para o nome EXATO do arquivo HTML do seu gráfico -->
    <iframe src="grafico_3d.html" class="iframe-grafico"></iframe>
  </div>

  <script>
    // Função para alternar entre as abas
    function switchTab(tabId) {
      document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Carregar o PDB da proteína
    document.addEventListener("DOMContentLoaded", function() {
      let element = document.getElementById('mol-viewer');
      let viewer = $3Dmol.createViewer(element, { backgroundColor: 'white' });

      fetch('vitellogenin.pdb')
        .then(response => response.text())
        .then(data => {
          viewer.addModel(data, "pdb");
          viewer.setStyle({}, { cartoon: { colorscheme: { prop: 'b', gradient: 'rwb', min: 50, max: 90 } } });
          viewer.zoomTo();
          viewer.render();
        });
    });
  </script>

</body>
</html>
