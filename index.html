<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análise Proteômica 3D</title>
  
  <!-- Biblioteca 3Dmol.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
    }

    /* Menu de Abas superior */
    .tab-buttons {
      display: flex;
      justify-content: center;
      background-color: #ffffff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      max-width: 300px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      background: none;
      cursor: pointer;
      color: #666;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: #238b8b;
      border-bottom: 3px solid #238b8b;
    }

    .content-section {
      display: none;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .content-section.active {
      display: block;
    }

    /* Container do Visualizador 3D Corrigido */
    .viewer-container {
      position: relative;
      width: 100%;
      height: 60vh;
      min-height: 420px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background-color: #fff;
      margin-top: 15px;
      overflow: hidden;
    }

    #mol-viewer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Barra de Confiabilidade */
    .confidence-bar {
      display: flex;
      height: 12px;
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      margin: 15px 0 8px 0;
    }

    .segment.high { background-color: #238b8b; }
    .segment.moderate { background-color: #808080; }
    .segment.low { background-color: #7030a0; }

    .confidence-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .label.high { color: #238b8b; }
    .label.moderate { color: #808080; }
    .label.low { color: #7030a0; }

    .iframe-grafico {
      width: 100%;
      height: 60vh;
      min-height: 450px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background-color: #fff;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Menu de Navegação -->
  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('tab-3d')">Proteína 3D</button>
    <button class="tab-btn" onclick="switchTab('tab-graficos')">Gráfico 3D Interativo</button>
  </div>

  <!-- ABA 1: Proteína 3D -->
  <div id="tab-3d" class="content-section active">
    <h2>Vitellogenina (AlphaFold 2)</h2>
    <p style="font-size: 13px; color: #666; margin-top: 5px;">Interaja: rote com 1 dedo e faça zoom com 2 dedos.</p>
    
    <div class="viewer-container">
      <div id="mol-viewer"></div>
    </div>
  </div>

  <!-- ABA 2: Gráfico 3D Interativo -->
  <div id="tab-graficos" class="content-section">
    <h2>Confiabilidade dos Modelos</h2>
    
    <div class="confidence-bar">
      <div class="segment high" style="width: 39.6%;"></div>
      <div class="segment moderate" style="width: 31.4%;"></div>
      <div class="segment low" style="width: 28.9%;"></div>
    </div>
    <div class="confidence-labels">
      <span class="label high">High 2.075 (39.6%)</span>
      <span class="label moderate">Moderate 1.644 (31.4%)</span>
      <span class="label low">Low 1.515 (28.9%)</span>
    </div>

    <h3 style="margin-top: 20px;">Distribuição de Métricas (3D)</h3>
    <iframe src="grafico_3d.html" class="iframe-grafico"></iframe>
  </div>

  <script>
    let viewer = null;

    // Função para alternar abas e recalcular tamanho do canvas 3D
    function switchTab(tabId) {
      document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');

      if (tabId === 'tab-3d' && viewer) {
        setTimeout(() => {
          viewer.resize();
          viewer.render();
        }, 100);
      }
    }

    // Inicialização da molécula 3D
    document.addEventListener("DOMContentLoaded", function() {
      let element = document.getElementById('mol-viewer');
      viewer = $3Dmol.createViewer(element, { backgroundColor: 'white' });

      fetch('vitellogenin.cif')
        .then(response => {
          if (!response.ok) throw new Error("Ficheiro vitellogenin.cif não encontrado");
          return response.text();
        })
        .then(data => {
          viewer.addModel(data, "cif");
          viewer.setStyle({}, {
            cartoon: {
              colorscheme: { prop: 'b', gradient: 'rwb', min: 50, max: 90 }
            }
          });
          viewer.zoomTo();
          viewer.render();
          viewer.resize();
        })
        .catch(err => console.error("Erro ao carregar a estrutura:", err));
    });
  </script>

</body>
</html>
